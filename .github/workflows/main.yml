name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: crashoutcompany/.github/.github/workflows/ci.yml@03bade3a0c168a59340fb8e338bf19b52c79f9bc # main 03bade3 (post-#16)
    with:
      has-e2e: true
      e2e-branch-expires-minutes: 120
      e2e-cleanup-stale: true
    secrets: inherit
