name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: crashoutcompany/.github/.github/workflows/ci.yml@72b17a43589bb357f01c41bed231b8e2390912e2 # v1.6.0
    with:
      has-e2e: true
      e2e-branch-expires-minutes: 120
      e2e-cleanup-stale: true
    secrets: inherit
