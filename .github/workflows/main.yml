name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BETTER_AUTH_SECRET: test-better-auth-secret-at-least-32-characters

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
      AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add --global vercel@latest
      - name: Pull Vercel environment
        env:
          VERCEL_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
        run: vercel pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"
      - name: Build with Vercel
        env:
          VERCEL_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
        run: |
          if [ "$VERCEL_ENV" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

  e2e:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_AUTH_SECRET: ${{ secrets.TEST_AUTH_SECRET != '' && secrets.TEST_AUTH_SECRET || 'test-auth-secret' }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET != '' && secrets.BETTER_AUTH_SECRET || 'test-better-auth-secret-at-least-32-characters' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Resolve Neon branch
        id: neon
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
          HEAD_REF: ${{ github.head_ref }}
          GIT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            safe_ref="${HEAD_REF//\//-}"
            printf 'name=preview/pr-%s-%s\n' "$PR_NUMBER" "$safe_ref" >> "$GITHUB_OUTPUT"
            printf 'ephemeral=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'name=ci/e2e-%s\n' "$GIT_SHA" >> "$GITHUB_OUTPUT"
            printf 'ephemeral=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Create or reuse Neon branch
        id: database
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: ${{ steps.neon.outputs.name }}
          api_key: ${{ secrets.NEON_API_KEY }}
          database: ${{ secrets.NEON_DATABASE }}
          role: ${{ secrets.NEON_ROLE }}

      - name: Install dependencies
        env:
          DATABASE_URL: ${{ steps.database.outputs.db_url_pooled }}
        run: pnpm install --frozen-lockfile

      - name: Build E2E application
        env:
          DATABASE_URL: ${{ steps.database.outputs.db_url_pooled }}
          EXPOSE_TESTING_API: "1"
        run: pnpm build:e2e

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run authenticated E2E
        env:
          DATABASE_URL: ${{ steps.database.outputs.db_url_pooled }}
          EXPOSE_TESTING_API: "1"
        run: pnpm test:e2e

      - name: Delete ephemeral Neon branch
        if: always() && steps.neon.outputs.ephemeral == 'true' && steps.database.outcome == 'success'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: ${{ steps.database.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
