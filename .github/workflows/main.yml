# shared:ci-main v1
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HAS_TYPECHECK: "true"
  HAS_E2E: "true"
  NEEDS_PRISMA: "false"
  TEST_SCRIPT: test
  INSTALL_FLAGS: ""
  USE_PRISMA_NEON: "false"
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
  DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
  BETTER_AUTH_SECRET: test-better-auth-secret-at-least-32-characters
  TEST_AUTH_SECRET: test-auth-secret

jobs:
  lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile ${{ env.INSTALL_FLAGS }}
      - name: Apply Prisma schema
        if: env.NEEDS_PRISMA == 'true'
        run: |
          pnpm exec prisma db push
          pnpm exec prisma generate --sql
      - run: pnpm lint
      - name: Typecheck
        if: env.HAS_TYPECHECK == 'true'
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile ${{ env.INSTALL_FLAGS }}
      - name: Apply Prisma schema
        if: env.NEEDS_PRISMA == 'true'
        run: |
          pnpm exec prisma db push
          pnpm exec prisma generate --sql
      - run: pnpm ${{ env.TEST_SCRIPT }}

  build:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET != '' && secrets.BETTER_AUTH_SECRET || 'test-better-auth-secret-at-least-32-characters' }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
      AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add --global vercel@latest
      - name: Pull Vercel environment
        env:
          VERCEL_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
        run: vercel pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"
      - name: Build with Vercel
        env:
          VERCEL_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
        run: |
          if [ "$VERCEL_ENV" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

  e2e:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_AUTH_SECRET: ${{ secrets.TEST_AUTH_SECRET != '' && secrets.TEST_AUTH_SECRET || 'test-auth-secret' }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET != '' && secrets.BETTER_AUTH_SECRET || 'test-better-auth-secret-at-least-32-characters' }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
      AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
      AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
      AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_E2E == 'true'
      - uses: pnpm/action-setup@v4
        if: env.HAS_E2E == 'true'
        with:
          version: 10.1.0
      - uses: actions/setup-node@v4
        if: env.HAS_E2E == 'true'
        with:
          node-version: "24"
          cache: pnpm

      - name: Resolve E2E database strategy
        if: env.HAS_E2E == 'true'
        id: dbplan
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          FALLBACK_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$NEON_API_KEY" ] && [ -n "$NEON_PROJECT_ID" ]; then
            echo "mode=neon" >> "$GITHUB_OUTPUT"
          elif [ -n "$FALLBACK_DATABASE_URL" ]; then
            echo "::warning::NEON_API_KEY/NEON_PROJECT_ID missing — falling back to secrets.DATABASE_URL for e2e. Configure Neon branch create for isolated CI DBs. See docs/better-auth-env.md."
            echo "mode=fallback" >> "$GITHUB_OUTPUT"
          else
            echo "::error::E2E needs either NEON_API_KEY + vars.NEON_PROJECT_ID (preferred) or secrets.DATABASE_URL. Ops/secrets gap — see docs/better-auth-env.md."
            exit 1
          fi

      - name: Resolve Neon branch
        if: env.HAS_E2E == 'true' && steps.dbplan.outputs.mode == 'neon'
        id: neon
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
          HEAD_REF: ${{ github.head_ref }}
          GIT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            safe_ref="${HEAD_REF//\//-}"
            printf 'name=preview/pr-%s-%s\n' "$PR_NUMBER" "$safe_ref" >> "$GITHUB_OUTPUT"
            printf 'ephemeral=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'name=ci/e2e-%s\n' "$GIT_SHA" >> "$GITHUB_OUTPUT"
            printf 'ephemeral=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Create or reuse Neon branch
        if: env.HAS_E2E == 'true' && steps.dbplan.outputs.mode == 'neon'
        id: database
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ steps.neon.outputs.name }}
          api_key: ${{ secrets.NEON_API_KEY }}
          database: ${{ secrets.NEON_DATABASE }}
          role: ${{ secrets.NEON_ROLE }}
          prisma: ${{ env.USE_PRISMA_NEON == 'true' }}

      - name: Install dependencies
        if: env.HAS_E2E == 'true'
        env:
          DATABASE_URL: ${{ steps.dbplan.outputs.mode == 'neon' && steps.database.outputs.db_url_pooled || secrets.DATABASE_URL }}
          DIRECT_URL: ${{ steps.dbplan.outputs.mode == 'neon' && steps.database.outputs.db_url || secrets.DIRECT_URL || secrets.DATABASE_URL }}
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: env.HAS_E2E == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run authenticated E2E
        if: env.HAS_E2E == 'true'
        env:
          DATABASE_URL: ${{ steps.dbplan.outputs.mode == 'neon' && steps.database.outputs.db_url_pooled || secrets.DATABASE_URL }}
          DIRECT_URL: ${{ steps.dbplan.outputs.mode == 'neon' && steps.database.outputs.db_url || secrets.DIRECT_URL || secrets.DATABASE_URL }}
          EXPOSE_TESTING_API: "1"
        run: pnpm test:e2e

      - name: Delete ephemeral Neon branch
        if: always() && env.HAS_E2E == 'true' && steps.dbplan.outputs.mode == 'neon' && steps.neon.outputs.ephemeral == 'true' && steps.database.outcome == 'success'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.database.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
