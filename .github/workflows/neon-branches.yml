# shared:neon-branches v1
name: Neon branches

on:
  pull_request:
    types: [opened, reopened, closed]

permissions:
  contents: read

jobs:
  create:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Require Neon API credentials
        id: gate
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::warning::Skipping Neon preview branch create — set GitHub secret NEON_API_KEY and variable NEON_PROJECT_ID (plus NEON_DATABASE / NEON_ROLE). This is an ops/secrets gap, not an app code failure. See docs/better-auth-env.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve Neon branch
        if: steps.gate.outputs.skip != 'true'
        id: neon
        env:
          PR_NUMBER: ${{ github.event.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          safe_ref="${HEAD_REF//\//-}"
          printf 'name=preview/pr-%s-%s\n' "$PR_NUMBER" "$safe_ref" >> "$GITHUB_OUTPUT"
      - uses: neondatabase/create-branch-action@v6
        if: steps.gate.outputs.skip != 'true'
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ steps.neon.outputs.name }}
          api_key: ${{ secrets.NEON_API_KEY }}
          database: ${{ secrets.NEON_DATABASE }}
          role: ${{ secrets.NEON_ROLE }}

  delete:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Require Neon API credentials
        id: gate
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::warning::Skipping Neon preview branch delete — NEON_API_KEY / NEON_PROJECT_ID not configured."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve Neon branch
        if: steps.gate.outputs.skip != 'true'
        id: neon
        env:
          PR_NUMBER: ${{ github.event.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          safe_ref="${HEAD_REF//\//-}"
          printf 'name=preview/pr-%s-%s\n' "$PR_NUMBER" "$safe_ref" >> "$GITHUB_OUTPUT"
      - uses: neondatabase/delete-branch-action@v3
        if: steps.gate.outputs.skip != 'true'
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.neon.outputs.name }}
          api_key: ${{ secrets.NEON_API_KEY }}
